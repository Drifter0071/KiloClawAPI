<!doctype html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <base href="/dashboard/admin/">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512.png">
  <title>NCT Operations</title>
  <script>
    // Theme bootstrap for the standalone admin SPA. Mirrors the same
    // localStorage key as the main operator app (nct-theme) so the
    // theme is consistent across both surfaces. Runs before Vue mounts
    // so there's no flash of the wrong palette on the first paint.
    (function () {
      try {
        var KEY = 'nct-theme';
        var stored = localStorage.getItem(KEY);
        var pref = (stored === 'light' || stored === 'dark' || stored === 'auto')
          ? stored
          : 'auto';
        var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var resolved = pref === 'auto' ? (sysDark ? 'dark' : 'light') : pref;
        document.documentElement.dataset.theme = resolved;
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
</head>
<body class="bg-canvas text-text-primary antialiased">
  <div id="admin-app"></div>
  <script type="module" src="/src/admin-main.ts"></script>
</body>
</html>
