<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <base href="/dashboard/v2/">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512.png">
  <!-- PWA (feature #4): manifest + install/mobile meta. The manifest is
       emitted from public/ next to the built assets, so a relative
       href resolves correctly under the <base> prefix. -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#0b0e13">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NCT Szerviz Ai">
  <title>NCT Szerviz Ai v2</title>
  <script>
    // Theme bootstrap. Runs before Vue mounts so the right palette is
    // applied on the very first paint (no flash of the wrong theme).
    // Logic mirrors src/composables/useTheme.ts — keep the two in sync.
    (function () {
      try {
        var KEY = 'nct-theme';
        var stored = localStorage.getItem(KEY);
        var pref = (stored === 'light' || stored === 'dark' || stored === 'auto')
          ? stored
          : 'auto';
        var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var resolved = pref === 'auto' ? (sysDark ? 'dark' : 'light') : pref;
        document.documentElement.dataset.theme = resolved;
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
</head>
<body class="bg-canvas text-text-primary antialiased">
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
