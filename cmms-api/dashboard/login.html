<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cmms-api dashboard — login</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      color: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: rgba(20, 20, 30, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 2.5rem 3rem;
      width: 380px;
      max-width: 90vw;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    h1 {
      margin: 0 0 0.25rem 0;
      font-size: 1.4rem;
      font-weight: 600;
    }
    .subtitle {
      margin: 0 0 1.5rem 0;
      font-size: 0.9rem;
      color: #9ca3af;
    }
    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 0.4rem;
      color: #d1d5db;
    }
    input[type="password"] {
      width: 100%;
      padding: 0.75rem 0.9rem;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: #fff;
      font-family: inherit;
    }
    input[type="password"]:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }
    button {
      width: 100%;
      margin-top: 1.2rem;
      padding: 0.75rem;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
    }
    button:hover { background: #4f46e5; }
    .error {
      margin-top: 1rem;
      padding: 0.6rem 0.8rem;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 6px;
      color: #fca5a5;
      font-size: 0.85rem;
    }
    .footer {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.75rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <form class="login-card" method="POST" action="/dashboard/login">
    <h1>cmms-api dashboard</h1>
    <p class="subtitle">Enter the access password to continue</p>
    <label for="pw">Password</label>
    <input
      type="password"
      id="pw"
      name="password"
      autofocus
      required
      autocomplete="current-password"
    />
    <button type="submit">Sign in</button>
    <div id="error" class="error" style="display:none">Wrong password.</div>
    <div class="footer">NCT / cmms-api &mdash; internal control plane</div>
  </form>
  <script>
    // Show error if ?error=1 in URL (e.g. wrong password redirect)
    if (new URLSearchParams(location.search).get("error") === "1") {
      document.getElementById("error").style.display = "block";
    }
  </script>
</body>
</html>
