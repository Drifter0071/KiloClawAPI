  <meta charset="UTF-8">

  <link rel="icon" type="image/png" sizes="512x512" href="/dashboard/v2/android-chrome-512.png">
  <title>NCT Szerviz Ai v2</title>
  <script>
    // Theme bootstrap. Runs before Vue mounts so the right palette is
    // applied on the very first paint (no flash of the wrong theme).
    // Logic mirrors src/composables/useTheme.ts — keep the two in sync.
    (function () {
      try {
        var KEY = 'nct-theme';
        var stored = localStorage.getItem(KEY);
        var pref = (stored === 'light' || stored === 'dark' || stored === 'auto')
          ? stored
          : 'auto';
        var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var resolved = pref === 'auto' ? (sysDark ? 'dark' : 'light') : pref;
        document.documentElement.dataset.theme = resolved;
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
